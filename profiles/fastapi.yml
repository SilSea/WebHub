# FastAPI with uvicorn (DESIGN §6.1). Dependencies go into data/venvs/<site>/ (never the project).
# requirements.txt only: a pyproject-only project (uv / poetry) needs another install command —
# a separate profile later (review-1 K2). Django (manage.py) with uvicorn is not FastAPI (K4).
schemaVersion: 1
id: fastapi
language: python
detect:
  all:
    - { file: "requirements.txt" }
  any:
    - { dep: "fastapi" }
    - { fileContains: ["requirements.txt", "fastapi"] }
  none:
    - { file: "manage.py" }
  score: 70
runtime:
  lang: python
  install: "pip install -r requirements.txt"
start:
  cmd: "uvicorn {module}:app --reload --host {HOST} --port {PORT}"
  vars: { module: "main" }
port: { default: 8000, via: arg }
host: { bind: "127.0.0.1" }
health: { path: "/docs", timeout: 60 }
container:
  image: "python:3.12-slim"
  workdir: /app
  setup: "pip install -r requirements.txt"
db:
  hints: ["psycopg", "sqlalchemy", "asyncpg", "redis"]
routes:
  detectPrefix: ["APIRouter(prefix=", "app.mount("]
